spring.application.name=api-gateway
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Gateway Routes

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=job-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://JOB-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/jobs/**

spring.cloud.gateway.server.webflux.routes[2].id=profile-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://PROFILE-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/profiles/**
# Application Service
spring.cloud.gateway.server.webflux.routes[3].id=application-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://APPLICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/applications/**

# Actuator
management.endpoints.web.exposure.include=health,info
jwt.secret=CareerLinkNetworksJwtSecretKey2026Secure